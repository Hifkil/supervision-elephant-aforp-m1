networks:
  artemis:
    driver: bridge

volumes:
  zabbix-db:
  artbdd01p-data:
  artbdd02p-data:
  grafana-data:
  prometheus-data:
  sftp-ssh-keys:
  nfs-web:
  glpi-data:
  glpi-db:
  graylog-mongo-data:
  graylog-mongo-config:
  graylog-opensearch-data:
  graylog-data:
  splunk-data:
  rsyslog-spool:

services:

  # ── Base de données Zabbix ────────────────────────────────────────────────
  artdb01p:
    image: postgres:16-alpine
    hostname: artdb01p
    networks:
      - artemis
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
    volumes:
      - zabbix-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zabbix-agent-artdb01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artdb01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artdb01p
    depends_on:
      - artzab01p
      - artdb01p
    restart: unless-stopped

  # ── Zabbix server ─────────────────────────────────────────────────────────
  artzab01p:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    hostname: artzab01p
    networks:
      - artemis
    environment:
      DB_SERVER_HOST: artdb01p
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
    ports:
      - "10051:10051"
    depends_on:
      artdb01p:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep zabbix_server > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Sidecar : agent pour le host "Zabbix server" pré-configuré.
  # Partage le namespace réseau d'artzab01p → joignable en 127.0.0.1:10050.
  zabbix-agent-artzab01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artzab01p"
    environment:
      ZBX_SERVER_HOST: "127.0.0.1,artzab01p"
      ZBX_HOSTNAME: artzab01p
    depends_on:
      - artzab01p
    restart: unless-stopped

  # ── Zabbix web ────────────────────────────────────────────────────────────
  artzabweb01p:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    hostname: artzabweb01p
    networks:
      - artemis
    environment:
      ZBX_SERVER_HOST: artzab01p
      DB_SERVER_HOST: artdb01p
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      PHP_TZ: Europe/Paris
    ports:
      - "8080:8080"
    depends_on:
      artzab01p:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  zabbix-agent-artzabweb01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artzabweb01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artzabweb01p
    depends_on:
      - artzab01p
      - artzabweb01p
    restart: unless-stopped

  # ── artweb01p — serveur web backend 1 ────────────────────────────────────
  artweb01p:
    build: ./nginx
    hostname: artweb01p
    networks:
      - artemis
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  zabbix-agent-artweb01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artweb01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artweb01p
    depends_on:
      - artzab01p
      - artweb01p
    restart: unless-stopped

  # ── artweb02p — serveur web backend 2 ────────────────────────────────────
  artweb02p:
    build: ./nginx
    hostname: artweb02p
    networks:
      - artemis
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  zabbix-agent-artweb02p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artweb02p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artweb02p
    depends_on:
      - artzab01p
      - artweb02p
    restart: unless-stopped

  # ── arthpx01p — HAProxy load balancer ────────────────────────────────────
  arthpx01p:
    build: ./haproxy
    hostname: arthpx01p
    networks:
      - artemis
    ports:
      - "80:80"
      - "8404:8404"
      - "8405:8405"
      - "8406:8406"
    depends_on:
      artweb01p:
        condition: service_healthy
      artweb02p:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8404/stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  zabbix-agent-arthpx01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:arthpx01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: arthpx01p
    depends_on:
      - artzab01p
      - arthpx01p
    restart: unless-stopped

  # ── artbdd01p / artbdd02p — cluster PostgreSQL Artemis ──────────────────
  artbdd01p:
    image: postgres:16-alpine
    hostname: artbdd01p
    networks:
      - artemis
    environment:
      POSTGRES_DB: artemis
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_REPLICATION_USER: repl_user
      POSTGRES_REPLICATION_PASSWORD: repl_secret
    volumes:
      - artbdd01p-data:/var/lib/postgresql/data
      - ./postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  zabbix-agent-artbdd01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artbdd01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artbdd01p
    depends_on:
      - artzab01p
      - artbdd01p
    restart: unless-stopped

  artbdd02p:
    image: postgres:16-alpine
    hostname: artbdd02p
    networks:
      - artemis
    environment:
      POSTGRES_DB: artemis
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_REPLICATION_USER: repl_user
      POSTGRES_REPLICATION_PASSWORD: repl_secret
      POSTGRES_PRIMARY_HOST: artbdd01p
    volumes:
      - artbdd02p-data:/var/lib/postgresql/data
      - ./postgres/replica/start-replica.sh:/usr/local/bin/start-replica.sh:ro
    command: ["bash", "/usr/local/bin/start-replica.sh"]
    depends_on:
      artbdd01p:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  zabbix-agent-artbdd02p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artbdd02p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artbdd02p
    depends_on:
      - artzab01p
      - artbdd02p
    restart: unless-stopped

  postgres-exporter-artbdd01p:
    image: prometheuscommunity/postgres-exporter:latest
    network_mode: "service:artbdd01p"
    environment:
      DATA_SOURCE_NAME: "postgresql://artemis:artemis@127.0.0.1:5432/artemis?sslmode=disable"
    depends_on:
      artbdd01p:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-artbdd02p:
    image: prometheuscommunity/postgres-exporter:latest
    network_mode: "service:artbdd02p"
    environment:
      DATA_SOURCE_NAME: "postgresql://artemis:artemis@127.0.0.1:5432/artemis?sslmode=disable"
    depends_on:
      artbdd02p:
        condition: service_healthy
    restart: unless-stopped

  # ── artglpt01p — GLPI ITSM avec base MySQL dédiée ────────────────────────
  artglptdb01p:
    image: mysql:8.4
    hostname: artglptdb01p
    networks:
      - artemis
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: glpi
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - glpi-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u glpi -pglpi -D glpi -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  zabbix-agent-artglptdb01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artglptdb01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artglptdb01p
    depends_on:
      - artzab01p
      - artglptdb01p
    restart: unless-stopped

  artglpt01p:
    image: glpi/glpi:latest
    hostname: artglpt01p
    networks:
      - artemis
    environment:
      GLPI_DB_HOST: artglptdb01p
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi
      TZ: Europe/Paris
    ports:
      - "8082:80"
    volumes:
      - glpi-data:/var/glpi
    depends_on:
      artglptdb01p:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  zabbix-agent-artglpt01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artglpt01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artglpt01p
    depends_on:
      - artzab01p
      - artglpt01p
    restart: unless-stopped

  # ── Logs / SIEM : Graylog, Splunk et concentrateur Rsyslog ───────────────
  artgradb01p:
    image: mongo:7.0
    hostname: artgradb01p
    networks:
      - artemis
    volumes:
      - graylog-mongo-data:/data/db
      - graylog-mongo-config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  zabbix-agent-artgradb01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artgradb01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artgradb01p
    depends_on:
      - artzab01p
      - artgradb01p
    restart: unless-stopped

  artgraidx01p:
    image: opensearchproject/opensearch:2.15.0
    hostname: artgraidx01p
    networks:
      - artemis
    environment:
      "discovery.type": single-node
      "plugins.security.disabled": "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "ArtemisOpenSearch1!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - graylog-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  zabbix-agent-artgraidx01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artgraidx01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artgraidx01p
    depends_on:
      - artzab01p
      - artgraidx01p
    restart: unless-stopped

  artgra01p:
    image: graylog/graylog:6.3
    hostname: artgra01p
    networks:
      - artemis
    entrypoint: "/usr/bin/tini -- wait-for-it artgraidx01p:9200 -- /docker-entrypoint.sh"
    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_PASSWORD_SECRET: artemis_graylog_password_secret_2026_change_me
      GRAYLOG_ROOT_PASSWORD_SHA2: 075f6c23fb5ac95d297aeec6f882fd7d646f2523b5fbfef8e302c8793839bd98
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
      GRAYLOG_ELASTICSEARCH_HOSTS: http://artgraidx01p:9200
      GRAYLOG_MONGODB_URI: mongodb://artgradb01p:27017/graylog
      GRAYLOG_REPORT_DISABLE_SANDBOX: "true"
      GRAYLOG_SERVER_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9000:9000"
      - "1514:1514/tcp"
      - "1514:1514/udp"
      - "12201:12201/tcp"
      - "12201:12201/udp"
    volumes:
      - graylog-data:/usr/share/graylog/data
    depends_on:
      artgradb01p:
        condition: service_healthy
      artgraidx01p:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/lbstatus | grep -q ALIVE"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  zabbix-agent-artgra01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artgra01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artgra01p
    depends_on:
      - artzab01p
      - artgra01p
    restart: unless-stopped

  artspl01p:
    build: ./splunk
    hostname: artspl01p
    networks:
      - artemis
    environment:
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_PASSWORD: splunkadmin
    ports:
      - "8000:8000"
      - "8088:8088"
      - "1515:1515"
    volumes:
      - splunk-data:/opt/splunk/var
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/en-US/account/login >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  zabbix-agent-artspl01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artspl01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artspl01p
    depends_on:
      - artzab01p
      - artspl01p
    restart: unless-stopped

  artrsy01p:
    build: ./rsyslog
    hostname: artrsy01p
    networks:
      - artemis
    ports:
      - "10514:514/tcp"
      - "10514:514/udp"
    volumes:
      - rsyslog-spool:/var/spool/rsyslog
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      artgra01p:
        condition: service_healthy
      artspl01p:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof rsyslogd >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  zabbix-agent-artrsy01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artrsy01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artrsy01p
    depends_on:
      - artzab01p
      - artrsy01p
    restart: unless-stopped

  # ── artsft02p — serveur SFTP pour sauvegarde web ─────────────────────────
  artsft02p:
    image: atmoz/sftp:alpine
    hostname: artsft02p
    networks:
      - artemis
    command: artemis:artemis:1001:::web
    ports:
      - "2222:22"
    volumes:
      - ./sftp/web:/home/artemis/web
      - sftp-ssh-keys:/etc/ssh
      - ./sftp/init.d:/etc/sftp.d:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  zabbix-agent-artsft02p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artsft02p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artsft02p
    depends_on:
      - artzab01p
      - artsft02p
    restart: unless-stopped

  # ── artnfs01p — serveur NFS pour sauvegarde web ──────────────────────────
  artnfs01p:
    image: itsthenetwork/nfs-server-alpine:latest
    hostname: artnfs01p
    networks:
      - artemis
    privileged: true
    environment:
      SHARED_DIRECTORY: /exports/web
    volumes:
      - nfs-web:/exports/web
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2049"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  zabbix-agent-artnfs01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artnfs01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artnfs01p
    depends_on:
      - artzab01p
      - artnfs01p
    restart: unless-stopped

  # ── artbkp01p — preuve de sauvegarde web vers SFTP et NFS ────────────────
  artbkp01p:
    image: busybox:1.36.1
    hostname: artbkp01p
    networks:
      - artemis
    volumes:
      - ./backup/source:/source:ro
      - ./backup/run-backup.sh:/opt/artemis/run-backup.sh:ro
      - ./sftp/web:/backup/sftp
      - nfs-web:/backup/nfs
    command: ["/bin/sh", "/opt/artemis/run-backup.sh"]
    depends_on:
      - artsft02p
      - artnfs01p
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/metrics | grep -q artemis_backup_last_status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  zabbix-agent-artbkp01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artbkp01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artbkp01p
    depends_on:
      - artzab01p
      - artbkp01p
    restart: unless-stopped

  # ── artbbx01p — Blackbox Exporter (probes HTTP / ICMP) ───────────────────
  artbbx01p:
    image: prom/blackbox-exporter:latest
    hostname: artbbx01p
    networks:
      - artemis
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    cap_add:
      - NET_RAW
    restart: unless-stopped

  zabbix-agent-artbbx01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artbbx01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artbbx01p
    depends_on:
      - artzab01p
      - artbbx01p
    restart: unless-stopped

  # ── artmet01p — métriques système Docker par service Compose ─────────────
  artmet01p:
    image: docker:26-cli
    hostname: artmet01p
    networks:
      - artemis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-metrics/exporter.sh:/usr/local/bin/exporter.sh:ro
      - zabbix-db:/mnt/volumes/zabbix-db:ro
      - artbdd01p-data:/mnt/volumes/artbdd01p-data:ro
      - artbdd02p-data:/mnt/volumes/artbdd02p-data:ro
      - grafana-data:/mnt/volumes/grafana-data:ro
      - prometheus-data:/mnt/volumes/prometheus-data:ro
      - sftp-ssh-keys:/mnt/volumes/sftp-ssh-keys:ro
      - nfs-web:/mnt/volumes/nfs-web:ro
      - glpi-data:/mnt/volumes/glpi-data:ro
      - glpi-db:/mnt/volumes/glpi-db:ro
      - graylog-mongo-data:/mnt/volumes/graylog-mongo-data:ro
      - graylog-mongo-config:/mnt/volumes/graylog-mongo-config:ro
      - graylog-opensearch-data:/mnt/volumes/graylog-opensearch-data:ro
      - graylog-data:/mnt/volumes/graylog-data:ro
      - splunk-data:/mnt/volumes/splunk-data:ro
      - rsyslog-spool:/mnt/volumes/rsyslog-spool:ro
    environment:
      COMPOSE_PROJECT_NAME: supervision-elephant-aforp-m1
    command: ["sh", "/usr/local/bin/exporter.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/metrics | grep -q artemis_container_cpu_percent"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  zabbix-agent-artmet01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artmet01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artmet01p
    depends_on:
      - artzab01p
      - artmet01p
    restart: unless-stopped

  # ── Exporters Prometheus : nginx ─────────────────────────────────────────
  nginx-exporter-artweb01p:
    image: nginx/nginx-prometheus-exporter:latest
    network_mode: "service:artweb01p"
    command: ["--nginx.scrape-uri=http://127.0.0.1/nginx_status"]
    depends_on:
      - artweb01p
    restart: unless-stopped

  nginx-exporter-artweb02p:
    image: nginx/nginx-prometheus-exporter:latest
    network_mode: "service:artweb02p"
    command: ["--nginx.scrape-uri=http://127.0.0.1/nginx_status"]
    depends_on:
      - artweb02p
    restart: unless-stopped

  # ── artpgr01p — Prometheus ───────────────────────────────────────────────
  artpgr01p:
    image: prom/prometheus:latest
    hostname: artpgr01p
    networks:
      - artemis
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  zabbix-agent-artpgr01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artpgr01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artpgr01p
    depends_on:
      - artzab01p
      - artpgr01p
    restart: unless-stopped

  # ── artgrf01p — Grafana dashboards ───────────────────────────────────────
  artgrf01p:
    image: grafana/grafana:11.5.2
    hostname: artgrf01p
    networks:
      - artemis
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      artpgr01p:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  zabbix-agent-artgrf01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artgrf01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artgrf01p
    depends_on:
      - artzab01p
      - artgrf01p
    restart: unless-stopped

  # ── artnag01p — Nagios monitoring ─────────────────────────────────────────
  artnag01p:
    image: jasonrivers/nagios:latest
    hostname: artnag01p
    networks:
      - artemis
    ports:
      - "8081:80"
    volumes:
      - ./nagios/conf.d:/opt/nagios/etc/conf.d
      - ./nagios/localhost.cfg:/opt/nagios/etc/objects/localhost.cfg
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u nagiosadmin:nagios http://localhost/nagios/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  zabbix-agent-artnag01p:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:artnag01p"
    environment:
      ZBX_SERVER_HOST: artzab01p
      ZBX_HOSTNAME: artnag01p
    depends_on:
      - artzab01p
      - artnag01p
    restart: unless-stopped
