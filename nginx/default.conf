server {
    listen 80;

    # Réponse simple qui affiche le nom du serveur — utile pour vérifier
    # que HAProxy répartit bien les requêtes entre les deux backends.
    location / {
        default_type text/plain;
        return 200 "Artemis Web Backend - servi par $hostname\n";
    }

    # Endpoint de métriques pour le template Zabbix "Nginx by Zabbix agent 2".
    # Accessible uniquement depuis localhost (l'agent sidecar partage le
    # namespace réseau du conteneur, donc 127.0.0.1 fonctionne).
    location /nginx_status {
        stub_status on;
    }
}
