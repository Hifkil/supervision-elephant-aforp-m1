global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── Prometheus lui-même ───────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Nginx : métriques stub_status exportées par nginx-prometheus-exporter ─
  - job_name: nginx
    static_configs:
      - targets:
          - artweb01p:9113
          - artweb02p:9113
        labels:
          app: nginx

  # ── Blackbox : probe HTTP sur les backends Nginx ──────────────────────────
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://artweb01p
          - http://artweb02p
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: artbbx01p:9115

  # ── Blackbox : probe ICMP (ping) sur les backends ─────────────────────────
  - job_name: blackbox_ping
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - artweb01p
          - artweb02p
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: artbbx01p:9115

  # ── Blackbox : services fichiers SFTP / NFS ───────────────────────────────
  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - artsft02p:22
          - artnfs01p:2049
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: artbbx01p:9115

  # ── HAProxy : endpoint Prometheus natif (port 8405 /metrics) ─────────────
  - job_name: haproxy
    static_configs:
      - targets:
          - arthpx01p:8405
        labels:
          app: haproxy
    metrics_path: /metrics
