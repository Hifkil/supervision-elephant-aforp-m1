global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── Prometheus lui-même ───────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Docker metrics : CPU / RAM / disque / réseau par service Compose ─────
  - job_name: docker_metrics
    static_configs:
      - targets: ['artmet01p:8080']
        labels:
          app: docker-metrics

  # ── Backup web : statut et fraîcheur de la copie SFTP/NFS ────────────────
  - job_name: artemis_backup
    metrics_path: /metrics
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ['artbkp01p:8080']
        labels:
          app: backup

  # ── Nginx : métriques stub_status exportées par nginx-prometheus-exporter ─
  - job_name: nginx
    static_configs:
      - targets:
          - artweb01p:9113
          - artweb02p:9113
        labels:
          app: nginx

  # ── PostgreSQL Artemis : métriques primaire / réplique ───────────────────
  - job_name: postgres
    static_configs:
      - targets:
          - artbdd01p:9187
        labels:
          app: postgres
          role: primary
      - targets:
          - artbdd02p:9187
        labels:
          app: postgres
          role: replica

  # ── Blackbox : probes HTTP applicatives ───────────────────────────────────
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://arthpx01p
          - http://artweb01p
          - http://artweb02p
          - http://artglpt01p
          - http://artgry01p:9000/api/system/lbstatus
          - http://artspl01p:8000/en-US/account/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: artbbx01p:9115

  # ── Blackbox : probe ICMP (ping) sur les backends ─────────────────────────
  - job_name: blackbox_ping
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - artweb01p
          - artweb02p
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: artbbx01p:9115

  # ── Blackbox : ports TCP applicatifs et supervision ───────────────────────
  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - artsft02p:22
          - artnfs01p:2049
          - artbdd01p:5432
          - artbdd02p:5432
          - artglpt01p:80
          - artglptdb01p:3306
          - artgrydb01p:27017
          - artgryidx01p:9200
          - artgry01p:9000
          - artgry01p:1514
          - artspl01p:8000
          - artspl01p:8088
          - artspl01p:1515
          - artrsy01p:514
          - artzabweb01p:8080
          - artnag01p:80
          - artprom01p:9090
          - artgrf01p:3000
          - artbkp01p:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: artbbx01p:9115

  # ── HAProxy : endpoint Prometheus natif (port 8405 /metrics) ─────────────
  - job_name: haproxy
    static_configs:
      - targets:
          - arthpx01p:8405
        labels:
          app: haproxy
    metrics_path: /metrics
