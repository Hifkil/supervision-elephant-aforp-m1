# Remplacement du localhost.cfg par défaut.
# On conserve le host et les checks système mais on retire le check HTTP
# qui retourne 401 (l'interface Nagios elle-même requiert une authentification).

define host {
    use                     linux-server
    host_name               localhost
    alias                   artnag01p (Nagios)
    address                 127.0.0.1
}

define service {
    use                     generic-service
    host_name               localhost
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}

define service {
    use                     generic-service
    host_name               localhost
    service_description     Current Load
    check_command           check_local_load!5.0,4.0,3.0!10.0,6.0,4.0
}

define service {
    use                     generic-service
    host_name               localhost
    service_description     Total Processes
    check_command           check_local_procs!250!400!RSZDT
}
