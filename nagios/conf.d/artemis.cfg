# ── Template check rapide (1 min) ─────────────────────────────────────────────

define service {
    name                    fast-service
    use                     generic-service
    check_interval          1
    retry_interval          1
    register                0
}

define command {
    command_name            check_icmp_fast
    command_line            $USER1$/check_icmp -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -n 5
}

# ── Hosts Artemis ─────────────────────────────────────────────────────────────

define host {
    use                     linux-server
    host_name               artweb01p
    alias                   Artemis Web Backend 1
    address                 artweb01p
}

define host {
    use                     linux-server
    host_name               artweb02p
    alias                   Artemis Web Backend 2
    address                 artweb02p
}

define host {
    use                     linux-server
    host_name               arthpx01p
    alias                   Artemis HAProxy
    address                 arthpx01p
}

define host {
    use                     linux-server
    host_name               artsft02p
    alias                   Artemis SFTP
    address                 artsft02p
}

define host {
    use                     linux-server
    host_name               artnfs01p
    alias                   Artemis NFS
    address                 artnfs01p
}

# ── Services artweb01p ────────────────────────────────────────────────────────

define service {
    use                     fast-service
    host_name               artweb01p
    service_description     PING
    check_command           check_icmp_fast!100.0,20%!500.0,60%
}

define service {
    use                     fast-service
    host_name               artweb01p
    service_description     HTTP
    check_command           check_http
}

define service {
    use                     fast-service
    host_name               artweb01p
    service_description     Nginx Status
    check_command           check_http!-u /nginx_status -s "Active connections"
}

