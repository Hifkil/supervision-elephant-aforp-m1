global
    log stdout format raw local0
    maxconn 50000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect  5s
    timeout client  30s
    timeout server  30s

# ── Frontend principal ────────────────────────────────────────────────────
frontend http_front
    bind *:80
    default_backend nginx_backends

# ── Backend : les deux serveurs nginx en round-robin ──────────────────────
backend nginx_backends
    balance     roundrobin
    option      httpchk GET /
    server      artweb01p artweb01p:80 check
    server      artweb02p artweb02p:80 check

# ── Page de statistiques (Zabbix "HAProxy by HTTP" la consomme en CSV) ────
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node

# ── Stats CSV pour Zabbix — proxy interne sans point-virgule dans l'URL ───
# Zabbix demande http://arthpx01p:8406/ → HAProxy reécrit le chemin en
# /stats;csv et proxifie vers son propre port 8404 (jamais de ; côté client)
frontend stats_zabbix
    bind *:8406
    default_backend haproxy_stats_csv
    no log

backend haproxy_stats_csv
    http-request set-path /stats;csv
    server self 127.0.0.1:8404

# ── Endpoint Prometheus natif ─────────────────────────────────────────────
frontend prometheus
    bind *:8405
    http-request use-service prometheus-exporter if { path /metrics }
    no log
