modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []   # accepte tous les 2xx
      method: GET
      preferred_ip_protocol: ip4

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
