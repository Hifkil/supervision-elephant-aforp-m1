apiVersion: 1

deleteRules:
  - orgId: 1
    uid: artemis-haproxy-frontend-down
  - orgId: 1
    uid: artemis-frontend-health
  - orgId: 1
    uid: artemis-web-backends-health
  - orgId: 1
    uid: artemis-glpi-health
  - orgId: 1
    uid: artemis-siem-health
  - orgId: 1
    uid: artemis-file-services-health
  - orgId: 1
    uid: artemis-database-health
  - orgId: 1
    uid: artemis-backup-health
  - orgId: 1
    uid: artemis-platform-capacity
