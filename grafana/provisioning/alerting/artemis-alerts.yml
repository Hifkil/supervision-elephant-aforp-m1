              expr: max((1 - min(haproxy_server_status{proxy="nginx_backends",state="UP"})) or (1 - min(probe_success{job="blackbox_http",instance=~"http://artweb0[12]p"})) or (1 - min(probe_success{job="blackbox_ping",instance=~"artweb0[12]p"})) or vector(0))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: One or more Nginx backends are unavailable from HAProxy or probes.
        labels:
          severity: critical
          service: web
        isPaused: false

