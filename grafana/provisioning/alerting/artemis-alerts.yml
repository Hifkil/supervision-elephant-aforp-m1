apiVersion: 1

groups:
  - orgId: 1
    name: Artemis lab health
    folder: Artemis
    interval: 30s
    rules:
      - uid: artemis-haproxy-frontend-down
        title: Artemis lab health problem
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max((1 - haproxy_frontend_status{proxy="http_front",state="UP"}) or (1 - min(haproxy_server_status{proxy="nginx_backends",state="UP"})) or (1 - min(up)) or (1 - min(probe_success{job=~"blackbox_http|blackbox_tcp"})) or clamp_max(sum(rate(haproxy_frontend_http_responses_total{proxy="http_front",code="5xx"}[2m])) * 1000, 1))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: artemis-supervision
        panelId: 7
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Artemis supervision lab has a frontend or monitoring problem.
          description: This alert fires if HAProxy http_front is down, one Nginx backend is down in HAProxy, any Prometheus target is down, an HTTP/SFTP/NFS Blackbox probe fails, or HAProxy returns frontend 5xx responses.
        labels:
          severity: warning
          service: artemis-lab
        isPaused: false
