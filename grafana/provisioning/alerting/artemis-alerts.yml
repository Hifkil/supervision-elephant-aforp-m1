groups:
  - orgId: 1
    name: Artemis frontend
    folder: Artemis
    interval: 30s
    rules:
      - uid: artemis-frontend-health
        guid: artemis-frontend-health
        title: Artemis frontend HAProxy problem
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max((1 - max(haproxy_frontend_status{proxy="http_front",state="UP"})) or clamp_max(sum(rate(haproxy_frontend_http_responses_total{proxy="http_front",code="5xx"}[2m])) * 1000, 1) or vector(0))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: HAProxy frontend is down or returns HTTP 5xx responses.
        labels:
          severity: critical
          service: frontend
        isPaused: false

